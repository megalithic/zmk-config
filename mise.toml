min_version = "2026.9.0"

[tools]
go = "1.27"
github-cli = "latest"
python = "3.13"
"go:github.com/new-er/zmk-flasher" = "v0.0.4"

[tasks.check]
description = "Validate Leeloo keymap and build matrix"
run = "./scripts/firmware check"

[tasks.preview]
description = "Preview both firmware targets and changes before building"
run = "./scripts/firmware preview"

[tasks.status]
description = "Show config, build, firmware, and backup status"
run = "./scripts/firmware status"

[tasks.runs]
description = "List recent GitHub firmware builds"
run = "./scripts/firmware runs"

[tasks.build]
description = "Build current remote master with GitHub Actions and download firmware"
run = "./scripts/firmware build"

[tasks.download]
description = "Download firmware from latest successful build of remote master"
run = "./scripts/firmware download"

[tasks.backup]
description = "Back up CURRENT.UF2 from both physical keyboard halves"
run = "./scripts/firmware backup"

[tasks.flash]
description = "Back up both halves, then flash with zmk-flasher"
run = "./scripts/firmware flash"

[tasks.restore]
description = "Restore both halves from the pre-flash rollback backup"
run = "./scripts/firmware restore"
